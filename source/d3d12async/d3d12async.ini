; d3d12async settings. Put next to d3d12.dll in the game's executable folder.
[d3d12async]
; 0 = pure pass-through (the DLL loads but changes nothing)
Enabled=1

; How long a PSO creation may block before the game gets a placeholder instead.
; Driver-cache hits finish in well under 1 ms, so they never get placeholders.
BudgetMs=1

; Which threads get placeholders:
;   all       - every thread (needed for Unreal Engine 5, which creates runtime PSOs on task threads)
;   recording - only threads that record command lists (closest to stock behaviour)
AsyncThreads=all

; Once this many compiles are waiting, non-recording threads block as usual, so a precache
; flood can't pile up memory. Recording threads are never held back.
MaxQueuedCompiles=256

; What happens once MaxQueuedCompiles compiles are waiting (toggle live in game: Ctrl+Shift+P):
;   compile     - the create compiles on the game's thread, as without the DLL (can hitch).
;   placeholder - it still gets a placeholder, but only while fewer than MaxPlaceholders
;                 placeholders are outstanding (not compiled yet); past that it compiles normally.   [default]
;                 Gameplay bursts stay below the limit (Borderlands 4 peaked at ~430), while a
;                 loading screen or precache flood (thousands) mostly compiles normally, so the
;                 screen still waits for its shaders.
QueueFullMode=placeholder
MaxPlaceholders=512

; EXPERIMENTAL - 1 = compile threads run in Windows 11 efficiency mode (EcoQoS: efficiency cores /
; lower clocks) with low memory priority, leaving more CPU to the game. Compiles finish later.
; Default 1 (the best Borderlands 4 run: 0 shader hitches in 13 minutes of gameplay).
WorkerEfficiencyMode=1

; EXPERIMENTAL - start at most this many background compiles per second (0 = no limit). Spreads
; compile work out to leave CPU headroom; compiles a draw is waiting for are never held back.
; Pair it with QueueFullMode=placeholder, otherwise the queue fills sooner and more creates
; compile on the game's thread.
MaxCompilesPerSecond=0

; Compute pipelines (culling, particles, Lumen, Nanite...) can't be skipped:
;   sync - compiled on the calling thread, like the game does on its own (many in parallel).
;   wait - compiled in the background; a dispatch that needs one waits for it. Only helps games
;          that precache compute well ahead of use. In Townfall it made level loads far worse:
;          the render thread ended up compiling hundreds of them one by one.
;   skip - EXPERIMENTAL: compiled in the background, and dispatches that use one are skipped until
;          it's ready (like draws). No waiting at all, but the skipped work is missing: expect
;          flicker, missing particles/effects or wrong lighting for a few frames, possibly worse.   [default]
ComputePipelineMode=skip

; Startup precompile: while the game is compiling its shaders at launch, every PSO compiles
; normally (stock behaviour, nothing skipped). The DLL detects when that flood is over - at least
; StartupMinPsos created, then StartupQuietSeconds seconds in a row with no more than
; StartupQuietRate new PSOs each - and only then starts compiling in the background. No restart.
; 0 = off: pipelines go to the background from the first one, the startup precompile included;
; StartupFpsCap and StartupBoostCompileThreads then do nothing.
StartupCompileNormally=1
StartupMinPsos=64
StartupQuietSeconds=10
StartupQuietRate=10
; A second also counts as busy while the game's CPU use (percent of all CPUs) is above this:
; a precompile keeps the CPU near 100%, so the phase can't end while the game is still compiling
; through routes the DLL can't see. 0 = ignore CPU.
StartupCpuBusyPercent=80
; The phase can't end before the precompile itself has been seen: at least StartupFloodSeconds busy
; seconds after the game's first frame (quiet intro videos before the compile screen don't count).
; If no precompile starts within StartupFloodWaitSeconds of the first frame (caches already warm),
; the normal quiet rule applies anyway. 0 = don't wait for a precompile.
StartupFloodSeconds=10
StartupFloodWaitSeconds=45
; For this many seconds after launch, nothing but the Ctrl+Shift+End hotkey can end the startup
; phase; after that, normal detection carries on if the game is still precompiling. Borderlands 4
; can go quiet for ~17 s between its intro and its compile screen. 0 = off.
StartupMinSeconds=40
; Warm launch (the game ran before, so the driver cache already holds its pipelines): once at least
; StartupMinPsos pipelines were created after the first frame, almost none of them real compiles
; (at most 2%), and no real compile for StartupQuietSeconds, the phase ends right away instead of
; waiting for StartupMinSeconds or a precompile. A create counts as a real compile if it takes at
; least StartupSlowCompileMs (cache hits take well under 1 ms).
StartupWarmLaunch=1
StartupSlowCompileMs=5
; Ctrl+Shift+End ends the startup phase by hand (e.g. if a game keeps compiling into gameplay).
StartupHotkey=1
; Optional hard limit on the startup phase in seconds (0 = none). Only a safety net for games
; whose CPU use never drops.
StartupMaxSeconds=0
; During the startup phase, the game thread that is compiling a pipeline runs at the highest
; thread priority for the length of that compile, so compiling gets the CPU before the rest of the game.
StartupBoostCompileThreads=1
; Frame-rate cap while the startup precompile runs (0 = off). Fewer frames to render leaves more
; CPU for compiling. Lifted automatically the moment the precompile is over; never applies in gameplay.
StartupFpsCap=30

; EXPERIMENTAL, off by default (game-dependent). Loading screens: while the game shows no new frame for LoadingGapMs, pipelines compile normally
; (stock behaviour), so a loading screen waits for its shaders instead of finishing early and
; leaving them to compile in gameplay. After a gap of at least 2x LoadingGapMs (a real loading
; screen rather than a hitch), this continues for LoadingHoldMs after frames resume, while the
; level fades in. Placeholders are only used while the game is actually presenting frames.
; Loading-screen frames are left out of the gameplay stats in the run logs.
LoadingCompileNormally=0
LoadingGapMs=500
LoadingHoldMs=1500

; UI-type pipelines (only 8-bit colour targets, no depth: menus, text, HUD, cached widget images):
;   wait  - compiled in the background like the rest, but a draw that needs one waits for it
;           (compiling it on the drawing thread if no worker has started it). Never skipped, and a
;           burst of new UI pipelines compiles in parallel instead of one by one.   [default]
;   sync  - compiled on the calling thread, one by one (older behaviour; can hitch on menus)
;   async - treated like any other pipeline: draws are skipped until ready (UI can stay empty)
UiPipelineMode=wait

; With UiPipelineMode=wait: a draw waits at most this many ms for its UI pipeline, then is skipped
; like any other draw (0 = wait for the whole compile). Avoids ~100 ms freezes when a menu or HUD
; screen opens for the first time; the price is a UI element that can stay empty until the game
; redraws it (Borderlands 4 once had an empty settings menu from a skipped UI draw).
UiWaitMaxMs=2

; Background compile threads. 0 = auto (a quarter of the CPU's hardware threads, 2..8).
Workers=2
; Extra compile threads that only work while more than BurstQueue compiles are waiting (a level
; load or precache wave), then go idle again. auto = as many as WorkerCpus allows (max 8); 0 = none.
BurstWorkers=auto
BurstQueue=16
LowPriorityWorkers=1

; Which logical CPUs the compile threads may run on (like Task Manager's "Set affinity"):
;   upper-half  - the last half (on a 16-thread CPU: CPU 8-15)   [default]
;   all         - any CPU
;   8-15  or  8,10,12-15  - an explicit list
; Only the compile threads are restricted; the game's own threads are untouched.
WorkerCpus=upper-half

; Small label on the left side of the game window showing the layer is loaded.
; Visible in windowed/borderless mode (not exclusive fullscreen). Click-through; never touches the game's frames.
Overlay=1
OverlayStats=1
OverlayOnlyWhenFocused=0
OverlayOpacity=200
; Frame-time graph in the label: green = normal, amber = hitch, red = hitch caused by a pipeline compile.
OverlayGraph=1
; Small settings panel in the bottom left of the game window. Settings are changed with hotkeys
; while the game has focus (the overlay is click-through): Ctrl+Shift+P = queue-full placeholders on/off.
; The hotkey works with the panel hidden too (the switch is written to d3d12async.log).
SettingsPanel=0
; Gameplay frames at least this slow are recorded as hitches (label, d3d12async.log, *_hitches.csv).
HitchMs=50

; Run logs, in d3d12async-runs\ next to the DLL: one .csv (per second: fps, frame times, PSOs,
; CPU) and one .txt summary per launch, labelled dll-ON or dll-OFF. runs.txt lists all kept runs,
; newest first, marked LATEST. A "dll-OFF" run is a launch with Enabled=0: the DLL then changes
; nothing and only measures (MeasureWhenDisabled=1), which gives a fair baseline.
RunLogs=1
RunLogsKeepOn=1
RunLogsKeepOff=1
MeasureWhenDisabled=1

; error | warn | info | perf | debug   (perf logs every placeholder; use for diagnosis only)
LogLevel=info
SlowCompileLogMs=50

; Testing only: delay every background compile by this many ms, to see what skipped draws look like.
DebugCompileDelayMs=0
